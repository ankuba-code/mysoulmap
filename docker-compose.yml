services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BOOKING_AFFILIATE_ID: ${BOOKING_AFFILIATE_ID:-}
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-soulmap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-soulmap_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-soulmap}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application_internal
    restart: unless-stopped

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-soulmap_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-soulmap}
      MYSQL_USER: ${MYSQL_USER:-soulmap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-soulmap_dev}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - application_internal
    volumes:
      - db_data:/var/lib/mysql

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - application_internal
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  application_internal:
    name: application_internal
    driver: bridge

volumes:
  db_data: