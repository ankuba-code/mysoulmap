# .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login zu GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: API-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}-api:latest

      - name: Web-Image bauen und pushen
        run: |
          set +e
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --progress=plain \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-web:latest" \
            ./frontend > /tmp/web-build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E 'npm error|No such file|not found|Missing:|Invalid:' /tmp/web-build.log | head -n 25 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-180)
              echo "::error::$clean"
            done
            exit "$code"
          fi

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/mysoulmap
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d